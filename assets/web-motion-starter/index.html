<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AeVideoGen Preview</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./timeline.js" defer></script>
  </head>
  <body>
    <main id="stage" aria-label="Video stage">
      <div class="ambient ambient-a"></div>
      <div class="ambient ambient-b"></div>
      <section id="titleScene" class="scene title-scene">
        <p class="eyebrow">A REAL PRODUCT STORY</p>
        <h1 id="heroTitle">把用户要记住的价值<br />放到真正的高潮</h1>
      </section>
      <section id="productScene" class="scene product-scene">
        <div id="productShell" class="product-shell">
          <div class="shell-bar"><span></span><span></span><span></span></div>
          <div class="shell-copy">
            <small>真实产品界面占位</small>
            <strong id="productClaim">点击真实控件</strong>
            <button id="demoButton" type="button">核心动作</button>
          </div>
        </div>
        <div id="pointer" class="pointer"></div>
      </section>
      <section id="valueScene" class="scene value-scene">
        <p>不是截图缩放</p>
        <h2 id="valueTitle">是有逻辑的产品电影</h2>
      </section>
    </main>

    <audio id="score" preload="auto"></audio>

    <aside id="previewDock" class="preview-dock" aria-label="Preview controls">
      <button id="playPause" class="play-button" type="button" aria-label="播放或暂停">▶</button>
      <button id="stepBack" type="button" aria-label="后退一帧">−1f</button>
      <div class="timeline-control">
        <div id="markerRail" class="marker-rail" aria-hidden="true"></div>
        <input id="scrubber" type="range" min="0" max="30" step="0.033333" value="0" />
      </div>
      <button id="stepForward" type="button" aria-label="前进一帧">+1f</button>
      <label>秒 <input id="timeInput" type="number" min="0" max="30" step="0.001" value="0" /></label>
      <label>帧 <input id="frameInput" type="number" min="0" max="900" step="1" value="0" /></label>
      <output id="readout">00:00.000 · 0000 / 0900</output>
    </aside>
  </body>
</html>
